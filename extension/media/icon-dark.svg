<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="orbit" x1="10" y1="0" x2="118" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3fe0ff"/>
      <stop offset="0.5" stop-color="#9b6bff"/>
      <stop offset="1" stop-color="#ffb02e"/>
    </linearGradient>
  </defs>
  <!-- The spinning top's orbit, behind it -->
  <g transform="rotate(-12 64 68)">
    <ellipse cx="64" cy="68" rx="52" ry="17" stroke="url(#orbit)" stroke-width="5"/>
  </g>
  <!-- The top: a faceted diamond, tilted as it spins -->
  <g transform="rotate(8 64 70)">
    <rect x="59" y="24" width="9" height="20" rx="2" fill="#3fe0ff"/>
    <rect x="63.5" y="24" width="4.5" height="20" rx="1" fill="#7b5cff"/>
    <polygon points="64,40 24,62 56,68" fill="#5fe8ff"/>
    <polygon points="64,40 56,68 104,62" fill="#8f6bff"/>
    <polygon points="24,62 56,68 62,110" fill="#22b4f5"/>
    <polygon points="56,68 104,62 62,110" fill="#5536e6"/>
  </g>
  <!-- The orbit's near half, in front of the top, and its two nodes -->
  <g transform="rotate(-12 64 68)">
    <path d="M12 68 A52 17 0 0 0 116 68" stroke="url(#orbit)" stroke-width="5"/>
    <circle cx="12" cy="68" r="7" fill="#3fe0ff"/>
    <circle cx="111" cy="57" r="7" fill="#ffb02e"/>
  </g>
</svg>
